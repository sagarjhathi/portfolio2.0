<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="YouTube multi-language UI validator with Java and Selenium">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a192f"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#ff0033" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#f89820" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f89820" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64ffda" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <g font-family="'Inter','Segoe UI',Arial,sans-serif">
    <text x="70" y="110" font-family="'Fira Code',Consolas,monospace" font-size="26" fill="#64ffda" letter-spacing="2">YOUTUBE &#183; 40+ LOCALES</text>
    <text x="70" y="215" font-size="86" font-weight="800" fill="#e6f1ff">Language</text>
    <text x="70" y="310" font-size="86" font-weight="800" fill="#e6f1ff">Validator</text>
    <text x="70" y="378" font-size="36" fill="#8892b0">Java + Selenium</text>

    <g font-family="'Fira Code',Consolas,monospace" font-size="26">
      <rect x="70" y="425" width="200" height="56" rx="28" fill="#f89820" fill-opacity="0.16" stroke="#f89820" stroke-width="2"/>
      <text x="170" y="462" text-anchor="middle" fill="#ffc27a">Java 21</text>
      <rect x="286" y="425" width="200" height="56" rx="28" fill="#2ead33" fill-opacity="0.16" stroke="#2ead33" stroke-width="2"/>
      <text x="386" y="462" text-anchor="middle" fill="#7fe38a">Selenium</text>
      <rect x="502" y="425" width="160" height="56" rx="28" fill="#64ffda" fill-opacity="0.1" stroke="#64ffda" stroke-width="2"/>
      <text x="582" y="462" text-anchor="middle" fill="#64ffda">Lingua</text>
    </g>

    <g font-family="'Fira Code',Consolas,monospace" font-size="26" fill="#a8b2d1">
      <text x="70" y="567">&#9656; Excel-driven data</text>
      <text x="70" y="612">&#9656; Lingua detection</text>
      <text x="70" y="657">&#9656; Parallel TestNG</text>
    </g>

    <g transform="translate(740 110)">
      <rect width="470" height="500" rx="20" fill="#0a192f" fill-opacity="0.9" stroke="#233554" stroke-width="2"/>
      <path d="M0 20a20 20 0 0 1 20-20h430a20 20 0 0 1 20 20v34H0z" fill="#172a45"/>
      <circle cx="32" cy="27" r="8" fill="#ff5f56"/>
      <circle cx="58" cy="27" r="8" fill="#ffbd2e"/>
      <circle cx="84" cy="27" r="8" fill="#27c93f"/>

      <rect x="32" y="84" width="64" height="46" rx="12" fill="#ff0033"/>
      <path d="M57 95 L57 119 L77 107 Z" fill="#fff"/>
      <text x="112" y="119" font-size="34" font-weight="700" fill="#e6f1ff">YouTube</text>

      <g font-family="'Fira Code',Consolas,monospace" font-size="24">
        <rect x="32" y="160" width="406" height="56" rx="10" fill="#112240"/>
        <text x="54" y="196" fill="#ccd6f6">English</text>
        <text x="414" y="196" text-anchor="end" fill="#64ffda">en &#10003;</text>
        <rect x="32" y="228" width="406" height="56" rx="10" fill="#112240"/>
        <text x="54" y="264" fill="#ccd6f6">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368;</text>
        <text x="414" y="264" text-anchor="end" fill="#64ffda">hi &#10003;</text>
        <rect x="32" y="296" width="406" height="56" rx="10" fill="#112240"/>
        <text x="54" y="332" fill="#ccd6f6">Deutsch</text>
        <text x="414" y="332" text-anchor="end" fill="#64ffda">de &#10003;</text>
        <rect x="32" y="364" width="406" height="56" rx="10" fill="#112240"/>
        <text x="54" y="400" fill="#ccd6f6">Fran&#231;ais</text>
        <text x="414" y="400" text-anchor="end" fill="#64ffda">fr &#10003;</text>
        <text x="32" y="464" font-size="20" fill="#8892b0">8 checks &#183; html lang verified</text>
      </g>
    </g>
  </g>
</svg>
